replicaCount: 1
image:
  repository: dimozone/fleet-tenancy-api
  pullPolicy: IfNotPresent
  tag: c569216
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
env:
  ENVIRONMENT: dev
  LOG_LEVEL: info
  SERVICE_NAME: fleet-tenancy-api
  API_PORT: '8084'
  WEBHOOK_PORT: '8087'
  MONITORING_PORT: '8085'
  DB_PORT: '5432'
  DB_NAME: fleet_tenancy_api
  DB_MAX_OPEN_CONNECTIONS: '10'
  DB_MAX_IDLE_CONNECTIONS: '3'
  DB_SSL_MODE: require
  JWT_KEY_SET_URL: https://auth.dimo.zone/keys
  DIMO_AUTH_URL: https://auth.dimo.zone
  TOKEN_EXCHANGE_URL: https://token-exchange-api.dimo.zone
  VEHICLE_NFT_ADDRESS: '0xbA5738a18d83D41847dfFbDC6101d37C69c9B0cF'
  IDENTITY_API_ENDPOINT: https://identity-api.dimo.zone/query
  ACCOUNTS_API_ENDPOINT: https://accounts.dimo.org
  PROVISION_EMAIL_FROM: no-reply@dimo.co
  POSTMARK_PROVISION_TEMPLATE_ALIAS: fleet-access-granted
  FLEET_APP_BASE_URL: https://fleets.dimo.co
  INVITATION_FROM_EMAIL: no-reply@dimo.co
  POSTMARK_INVITATION_TEMPLATE_ALIAS: fleet-invitation
  INVITE_EXPIRY_HOURS: '168'
  INVITE_ACCEPT_URL_BASE: https://fleets.dimo.co
  ATTEST_API_URL: https://attest.dimo.zone
  CHAIN_ID: '137'
  SACD_ADDRESS: '0x3c152B5d96769661008Ff404224d6530FCAC766d'
  SACD_UPLOAD_URL: https://assets.dimo.org/ipfs
  SYNTHETIC_NFT_ADDRESS: '0x4804e8D1661cd1a1e5dDdE1ff458A7f878c0aC6D'
ingress:
  enabled: false
  className: nginx
  linkerdClientIdentities:
    - ingress-ingress-nginx.ingress.serviceaccount.identity.linkerd.cluster.local
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: ingress/cf-origin-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: 'on'
    external-dns.alpha.kubernetes.io/hostname: fleet-tenancy-webhooks.dimo.co
  hosts:
    - host: fleet-tenancy-webhooks.dimo.co
      paths:
        - path: /webhooks/postmark
          pathType: Exact
  tls: []
service:
  type: ClusterIP
  ports:
    http:
      port: 8084
      targetPort: http
      protocol: TCP
    webhook:
      port: 8087
      targetPort: webhook
      protocol: TCP
    mon-http:
      port: 8085
      targetPort: mon-http
      protocol: TCP
ports:
  - name: http
    containerPort: 8084
    protocol: TCP
  - name: webhook
    containerPort: 8087
    protocol: TCP
  - name: mon-http
    containerPort: 8085
    protocol: TCP
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
nodeSelector: {}
tolerations: []
affinity: {}
podDisruptionBudget:
  minAvailable: 0
cronJobs:
  - name: publish-group-attestations
    enabled: true
    schedule: '*/10 * * * *'
    script: |
      /fleet-tenancy-api publish-group-attestations
  - name: reconcile-vehicles
    enabled: true
    schedule: 0 4 * * *
    backoffLimit: 0
    ttlSecondsAfterFinished: 259200
    script: |
      /fleet-tenancy-api reconcile-vehicles
serviceMonitor:
  enabled: true
  path: /metrics
  port: mon-http
  interval: 30s
grafanaDashboard:
  enabled: true
