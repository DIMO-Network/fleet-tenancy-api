replicaCount: 2
image:
  repository: dimozone/fleet-tenancy-api
  pullPolicy: IfNotPresent
  tag: 431be35
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
env:
  ENVIRONMENT: prod
  LOG_LEVEL: info
  SERVICE_NAME: fleet-tenancy-api
  API_PORT: '8084'
  WEBHOOK_PORT: '8087'
  MONITORING_PORT: '8085'
  DB_PORT: '5432'
  DB_NAME: fleet_tenancy_api
  DB_MAX_OPEN_CONNECTIONS: '20'
  DB_MAX_IDLE_CONNECTIONS: '6'
  DB_SSL_MODE: require
  JWT_KEY_SET_URL: https://auth.dimo.zone/keys
  # The DIMO platform services behind the token minter and on-behalf
  # provisioning. These have been in values.yaml since the chart was written
  # and were never copied here, so prod has been running with all four unset —
  # see the PR for what that means for each consumer.
  #
  # identity-api is reached in-cluster, matching kaufmann-oracle and
  # fleet-lite-app's prod charts and this file's own ATTEST_API_URL. The rest
  # have no in-cluster address and are the same public endpoints both siblings
  # use in prod.
  DIMO_AUTH_URL: https://auth.dimo.zone
  TOKEN_EXCHANGE_URL: https://token-exchange-api.dimo.zone
  IDENTITY_API_ENDPOINT: http://identity-api-prod.prod.svc.cluster.local:8080/query
  ACCOUNTS_API_ENDPOINT: https://accounts.dimo.org
  # The VehicleId NFT contract, used to build the did:erc721 subject of every
  # group attestation this service publishes. Unset, common.HexToAddress("")
  # yields the zero address and the DIDs name a contract that does not exist.
  VEHICLE_NFT_ADDRESS: '0xbA5738a18d83D41847dfFbDC6101d37C69c9B0cF'
  ATTEST_API_URL: http://dis-prod-attest.prod.svc.cluster.local:8080
  PROVISION_EMAIL_FROM: no-reply@dimo.co
  POSTMARK_PROVISION_TEMPLATE_ALIAS: fleet-access-granted
  FLEET_APP_BASE_URL: https://fleets.dimo.co
  INVITATION_FROM_EMAIL: no-reply@dimo.co
  POSTMARK_INVITATION_TEMPLATE_ALIAS: fleet-invitation
  INVITE_EXPIRY_HOURS: '168'
  INVITE_ACCEPT_URL_BASE: https://fleets.dimo.co
  CHAIN_ID: '137'
ingress:
  enabled: true
  className: nginx
  # Linkerd identities allowed to reach the `webhook` port. The namespace
  # defaults to deny, and the cluster's shared Servers only cover the port
  # names http/https/grpc/mon-http — see templates/linkerd-policy.yaml. Only
  # the ingress controller is admitted: nothing in-cluster should call this.
  linkerdClientIdentities:
    - ingress-ingress-nginx.ingress.serviceaccount.identity.linkerd.cluster.local
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: ingress/cf-origin-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: 'on'
    external-dns.alpha.kubernetes.io/hostname: fleet-tenancy-webhooks.dimo.co
  hosts:
    - host: fleet-tenancy-webhooks.dimo.co
      paths:
        - path: /webhooks/postmark
          pathType: Exact
  tls: []
service:
  type: ClusterIP
  ports:
    http:
      port: 8084
      targetPort: http
      protocol: TCP
    webhook:
      port: 8087
      targetPort: webhook
      protocol: TCP
ports:
  - name: http
    containerPort: 8084
    protocol: TCP
  - name: webhook
    containerPort: 8087
    protocol: TCP
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 1000m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
nodeSelector: {}
tolerations: []
affinity: {}
podDisruptionBudget:
  minAvailable: 1
