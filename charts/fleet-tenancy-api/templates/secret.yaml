apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fleet-tenancy-api.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  data:
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-tenancy-api/db_user
    secretKey: DB_USER
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-tenancy-api/db_password
    secretKey: DB_PASSWORD
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-tenancy-api/db_host
    secretKey: DB_HOST
  # AES-256-GCM key for every tenant's DIMO credentials at rest.
  #
  # Settings.Validate refuses to boot outside local if this is empty, and that
  # is deliberate: sha256("") is a valid AES-256 key, so an unset value does not
  # fail — it encrypts every credential under a constant anyone can compute,
  # silently. That exact failure reached production in fleet-lite-app.
  #
  # Two operational consequences:
  #   - The AWS Secrets Manager entry must exist BEFORE this chart is applied. A
  #     missing remoteRef fails the whole ExternalSecret, not just this key, so
  #     the pod gets no DB credentials either and never starts.
  #   - Treat the value as permanent. Once the backfill writes credentials under
  #     it, changing it means re-encrypting every row, not just editing config.
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-tenancy-api/tenant_secret_enc_key
    secretKey: TENANT_SECRET_ENC_KEY

  # Pre-shared keys gating /v1, as "name:key,name:key". The service refuses to
  # boot outside local without them, so this entry must exist in AWS Secrets
  # Manager before the image that requires it is released.
  #
  # The chart/image split makes that ordering the default rather than a matter
  # of care: merging to main syncs this ExternalSecret, while the code that
  # requires the value only ships on a v* tag.
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-tenancy-api/trusted_caller_keys
    secretKey: TRUSTED_CALLER_KEYS

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-secret-store
  target:
    name: {{ include "fleet-tenancy-api.fullname" . }}-secret
    template:
      metadata: {}
