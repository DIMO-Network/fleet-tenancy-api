ENVIRONMENT: local
LOG_LEVEL: debug
SERVICE_NAME: fleet-tenancy-api

API_PORT: 3010
MONITORING_PORT: 8086
# The public webhook listener — a separate Fiber app serving only
# POST /webhooks/postmark, so the chart's ingress can target it without
# exposing /v1. See internal/app/webhook_app.go.
WEBHOOK_PORT: 8087

DB:
  USER: dimo
  PASSWORD: dimo
  HOST: localhost
  PORT: 5432
  NAME: fleet_tenancy_api
  SSL_MODE: disable
  MAX_OPEN_CONNECTIONS: 10
  MAX_IDLE_CONNECTIONS: 3

# DIMO JWKS — verifies both end-user JWTs and developer-license JWTs.
JWT_KEY_SET_URL: https://auth.dimo.zone/keys

# AES-256-GCM key for tenant credentials at rest. The service refuses to start
# outside local if this is empty: an unset key is not "no encryption", it is
# encryption under sha256(""), which anyone can compute.
TENANT_SECRET_ENC_KEY: ""

# DIMO platform services behind the token minter and provisioning. Not required
# to boot — /v1/authz stays available without them; a mint or provision call
# fails with a named error instead. Values match the sibling repos.
DIMO_AUTH_URL: https://auth.dimo.zone
TOKEN_EXCHANGE_URL: https://token-exchange-api.dimo.zone
VEHICLE_NFT_ADDRESS: '0xbA5738a18d83D41847dfFbDC6101d37C69c9B0cF'
IDENTITY_API_ENDPOINT: https://identity-api.dimo.zone/query
ACCOUNTS_API_ENDPOINT: https://accounts.dimo.org

# The group-attestation publisher (publish-group-attestations). Only that
# command needs these; the API serves without them.
ATTEST_API_URL: https://attest.dimo.zone
CHAIN_ID: 137

# On-chain vehicle sharing (docs/HANDOFF.md, "Vehicle sharing"). Not boot-required:
# unset means the feature is off and the job queue never starts, which is what
# every environment looks like until the SACD and bundler settings are in place.
#
# SACD_ADDRESS is the DIMO Service Access Control Document contract — a separate
# contract from both the registry and the VehicleId NFT above. The Polygon
# mainnet value is 0x3c152B5d96769661008Ff404224d6530FCAC766d.
#
# RPC_URL and BUNDLER_URL carry API keys; the bundler URL doubles as the
# paymaster URL (ZeroDev serves both from one project URL).
SACD_ADDRESS: ""
RPC_URL: ""
BUNDLER_URL: ""

# Email invitations (docs/plans/04-invitations-into-tenancy.md). Key names
# match fleet-lite-app's — the flow moved here. None are boot-required: an
# empty Postmark token records invites with emailSent=false, and an empty
# webhook secret disables POST /webhooks/postmark.
POSTMARK_WEBHOOK_SECRET: ""
INVITATION_FROM_EMAIL: no-reply@dimo.co
POSTMARK_INVITATION_TEMPLATE_ALIAS: fleet-invitation
INVITE_EXPIRY_HOURS: 168
# Where the emailed accept link points — always fleet-lite, whoever sent it.
INVITE_ACCEPT_URL_BASE: https://fleets.dimo.co
