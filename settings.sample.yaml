ENVIRONMENT: local
LOG_LEVEL: debug
SERVICE_NAME: fleet-tenancy-api

API_PORT: 3010
MONITORING_PORT: 8086

DB:
  USER: dimo
  PASSWORD: dimo
  HOST: localhost
  PORT: 5432
  NAME: fleet_tenancy_api
  SSL_MODE: disable
  MAX_OPEN_CONNECTIONS: 10
  MAX_IDLE_CONNECTIONS: 3

# DIMO JWKS — verifies both end-user JWTs and developer-license JWTs.
JWT_KEY_SET_URL: https://auth.dimo.zone/keys

# AES-256-GCM key for tenant credentials at rest. The service refuses to start
# outside local if this is empty: an unset key is not "no encryption", it is
# encryption under sha256(""), which anyone can compute.
TENANT_SECRET_ENC_KEY: ""
