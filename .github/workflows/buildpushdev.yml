name: buildpushdev
on:
  push:
    branches:
      - main

jobs:
  build_dev:
    name: buildpushdev
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "BUILD_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            COMMIT_HASH=${{ steps.slug.outputs.BUILD_TAG }}
          tags: dimozone/fleet-tenancy-api:${{ steps.slug.outputs.BUILD_TAG }}, dimozone/fleet-tenancy-api:latest

      # Keeps the base values current, and — more useful while there is no dev
      # environment — means the Docker build runs on every merge to main rather
      # than for the first time at release, where a broken build blocks a
      # release instead of a PR.
      - name: Update Image Version in the related HelmChart values.yaml
        uses: fjogeleit/yaml-update-action@v0.15.0
        with:
          valueFile: 'charts/fleet-tenancy-api/values.yaml'
          propertyPath: 'image.tag'
          value: ${{ steps.slug.outputs.BUILD_TAG }}
          branch: main
          message: 'Update Image Version to ${{ steps.slug.outputs.BUILD_TAG }}'
